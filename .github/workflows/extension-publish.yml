name: Build and Publish Extension

on:
  push:
    tags: [ "extension-v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, Package and Publish Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#extension-v}" >> $GITHUB_OUTPUT

      - name: Stamp version into manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "apps/extension/manifest.chrome.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
            console.log("Stamped manifest version", manifest.version);
          '

      - name: Build and package Chrome extension
        run: pnpm --filter extension package:chrome

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-chrome-extension
          path: apps/extension/release/guardian-chrome-*.zip
          if-no-files-found: error

      - name: Check Chrome Web Store credentials
        if: github.event_name == 'workflow_dispatch'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: node apps/extension/scripts/publish.mjs --check

      - name: Publish to Chrome Web Store
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: node apps/extension/scripts/publish.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/extension/release/guardian-chrome-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Guardian Extension v${{ steps.version.outputs.version }}"
