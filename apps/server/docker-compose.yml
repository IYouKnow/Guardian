## Guardian Server — Docker Compose

name: guardian-server

services:
  guardian-server:
    container_name: guardian-server
    image: ghcr.io/iyouknow/guardian-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Production mode: the server ignores any .env file in its working
      # directory, so secrets must come from the environment (as below).
      GUARDIAN_ENV: "production"
      PORT: "8080"
      # REQUIRED: set a strong random value (e.g. `openssl rand -base64 32`).
      # Left empty on purpose — the server refuses to start until you set it.
      JWT_SECRET: ""
      # REQUIRED for the FIRST boot: while no admin account exists the server
      # refuses to start without this, and setup/registration is rejected. Set any
      # strong random string; you can remove it after the admin account is created.
      ADMIN_INVITE_CODE: ""
      # OPTIONAL: trusted reverse-proxy IPs/CIDRs for X-Forwarded-For. Leave empty
      # unless your proxy connects from a PUBLIC address — local/private proxies
      # (Cloudflare Tunnel, Docker, same-host nginx, Tailscale) are trusted automatically.
      TRUSTED_PROXIES: ""
      # OPTIONAL: extra browser origins for CORS + the WebSocket handshake.
      # The web panel is same-origin and the bundled native clients are already
      # allowed, so leave empty unless serving the panel from another origin.
      # Example: "https://vault.example.com"
      ALLOWED_ORIGINS: ""
    volumes:
      # Host path follows the CasaOS convention. On plain Docker, either create
      # this folder (mkdir -p /DATA/AppData/guardian-server/data) or change it
      # to any path you prefer (e.g. ./data for a folder next to this file).
      - /DATA/AppData/guardian-server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - guardian-network
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: "Web UI and API (HTTP)"
      volumes:
        - container: /app/data
          host: /DATA/AppData/guardian-server/data
          description:
            en_us: "SQLite databases and app data"
      envs:
        - container: GUARDIAN_ENV
          description:
            en_us: "Optional. Set to 'production' (the image default) to ignore any .env in the working directory; use 'development' to load one."
        - container: JWT_SECRET
          description:
            en_us: "REQUIRED. Random secret used to sign JWTs. Generate with: openssl rand -base64 32"
        - container: ADMIN_INVITE_CODE
          description:
            en_us: "REQUIRED for the first boot. Invite code required to create the first admin account; the server won't start without it while no admin exists."
        - container: TRUSTED_PROXIES
          description:
            en_us: "Optional. Trusted reverse-proxy IPs/CIDRs for X-Forwarded-For; only needed for a proxy on a public address"
        - container: ALLOWED_ORIGINS
          description:
            en_us: "Optional. Extra browser origins for CORS + WebSocket when serving the panel from another origin"

networks:
  guardian-network:
    name: guardian-network

x-casaos:
  architectures:
    - amd64
    - arm64
  main: guardian-server
  port_map: "8080"
  scheme: http
  hostname: ""
  index: /
  title:
    en_us: Guardian Server
  tagline:
    en_us: Self-hosted password manager server
  category: Utilities
  developer: iYouKnow
  author: iYouKnow
  description:
    en_us: |
      Guardian password manager server. After install, open http://<your-host-ip>:8080
      and complete setup. Replace JWT_SECRET with a strong random string before first
      start; the first user to register becomes admin (ADMIN_INVITE_CODE is required
      for this).
  tips:
    before_install:
      en_us: |
        REQUIRED: replace JWT_SECRET with a strong random string (e.g. `openssl rand -base64 32`).
        REQUIRED for the first boot: set ADMIN_INVITE_CODE to a strong random string — while no
        admin account exists the server won't start without it. You can remove it after setup.
    after_install:
      en_us: |
        For access beyond your LAN, put the server behind a TLS-terminating reverse proxy
        (Cloudflare Tunnel, nginx, Caddy, Traefik) and have it forward X-Forwarded-Proto: https;
        HSTS is then sent automatically. Local/private proxies are trusted for this by default.
        Every response already ships a strict CSP plus clickjacking, MIME-sniffing, referrer and
        permissions headers.
