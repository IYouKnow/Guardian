## Guardian Server — Docker Compose

name: guardian-server

services:
  guardian-server:
    container_name: guardian-server
    image: ghcr.io/iyouknow/guardian-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # REQUIRED: set a strong random value (e.g. `openssl rand -base64 32`).
      # Left empty on purpose — the server refuses to start until you set it.
      JWT_SECRET: ""
      ADMIN_INVITE_CODE: ""
      # OPTIONAL: trusted reverse-proxy IPs/CIDRs for X-Forwarded-For. Leave empty
      # unless your proxy connects from a PUBLIC address — local/private proxies
      # (Cloudflare Tunnel, Docker, same-host nginx, Tailscale) are trusted automatically.
      TRUSTED_PROXIES: ""
      # OPTIONAL: extra browser origins for CORS + the WebSocket handshake.
      # The web panel is same-origin and the bundled native clients are already
      # allowed, so leave empty unless serving the panel from another origin.
      # Example: "https://vault.example.com"
      ALLOWED_ORIGINS: ""
    volumes:
      # Host path follows the CasaOS convention. On plain Docker, either create
      # this folder (mkdir -p /DATA/AppData/guardian-server/data) or change it
      # to any path you prefer (e.g. ./data for a folder next to this file).
      - /DATA/AppData/guardian-server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - guardian-network
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: "Web UI and API (HTTP)"
      volumes:
        - container: /app/data
          host: /DATA/AppData/guardian-server/data
          description:
            en_us: "SQLite databases and app data"
      envs:
        - container: JWT_SECRET
          description:
            en_us: "REQUIRED. Random secret used to sign JWTs. Generate with: openssl rand -base64 32"
        - container: ADMIN_INVITE_CODE
          description:
            en_us: "Optional. Invite code required to create the first admin account"
        - container: TRUSTED_PROXIES
          description:
            en_us: "Optional. Trusted reverse-proxy IPs/CIDRs for X-Forwarded-For; only needed for a proxy on a public address"
        - container: ALLOWED_ORIGINS
          description:
            en_us: "Optional. Extra browser origins for CORS + WebSocket when serving the panel from another origin"

networks:
  guardian-network:
    name: guardian-network

x-casaos:
  architectures:
    - amd64
    - arm64
  main: guardian-server
  port_map: "8080"
  scheme: http
  hostname: ""
  index: /
  title:
    en_us: Guardian Server
  tagline:
    en_us: Self-hosted password manager server
  category: Utilities
  developer: iYouKnow
  author: iYouKnow
  description:
    en_us: |
      Guardian password manager server. After install, open http://<your-host-ip>:8080
      and complete setup. Replace JWT_SECRET with a strong random string before first
      start; the first user to register becomes admin (use ADMIN_INVITE_CODE to secure
      this).
  tips:
    before_install:
      en_us: |
        REQUIRED: replace JWT_SECRET with a strong random string (e.g. `openssl rand -base64 32`).
        Optional: set ADMIN_INVITE_CODE to restrict who can create the first admin account.
